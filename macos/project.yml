# XcodeGen spec: `xcodegen generate` writes AIUsage.xcodeproj (git ignores it).
# Signing team and bundle prefix come from Config.xcconfig and your Local.xcconfig.
name: AIUsage
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

packages:
  AIUsageKit:
    path: .

targets:
  AIUsage:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Shared
      - path: Assets.xcassets
    dependencies:
      - package: AIUsageKit
        product: AIUsageKit
      - target: AIUsageWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: AI Usage
        PRODUCT_BUNDLE_IDENTIFIER: $(AI_USAGE_BUNDLE_PREFIX).AIUsage
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/AIUsage.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  AIUsageWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - package: AIUsageKit
        product: AIUsageKit
    settings:
      base:
        PRODUCT_NAME: AIUsageWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(AI_USAGE_BUNDLE_PREFIX).AIUsage.Widgets
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widget/AIUsageWidgets.entitlements
        SKIP_INSTALL: YES
